name: Docker Build and Push

on:
  push:
    branches:
      - '**'
  release:
    types:
      - created

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Generate tag
        id: prep
        run: |
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
            echo "tag=latest" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "tag=$(date +'%Y%m%d%H%M%S')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      - name: Build and Push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            haozhealexzhang/cognitube-consumers:${{ env.tag }}
            haozhealexzhang/cognitube-consumers:latest

      - name: List Docker images after build
        run: docker images

      - name: Clean up Post Run
        run: |
          docker rmi haozhealexzhang/cognitube-consumers:${{ env.tag }} || true
          if [[ "${GITHUB_REF}" == 'refs/heads/main' ]]; then
            docker rmi haozhealexzhang/cognitube-consumers:latest || true
          fi
      
